
services:
  nifi:
    image: apache/nifi:latest
    container_name: nifi-container
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./driver:/opt/nifi/nifi-current/lib/postgresql-driver
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=SenhaForte123!
    networks:
      - nifi-net

  postgres:
    image: postgres:15-alpine
    container_name: postgres-container
    environment:
      - POSTGRES_DB=dbetl
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=segredo
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nifi-net

volumes:
    pgdata:

networks:
  nifi-net:
    driver: bridge